spring.application.name=social

# =========================================================================
# 🔌 CONFIGURAZIONE CONNESSIONE POSTGRESQL
# =========================================================================
# L'URL punta al tuo computer locale (localhost), sulla porta 5432, dentro il tuo database
spring.datasource.url=jdbc:postgresql://localhost:5432/social_connector_db
spring.datasource.username=postgres
# Inserisci qui sotto la password che hai scelto quando hai installato PostgreSQL
spring.datasource.password=postgres1234

# Sceglie il driver corretto per comunicare (quello che abbiamo selezionato su Initializr)
spring.datasource.driver-class-name=org.postgresql.Driver

# =========================================================================
# 🛡️ GESTIONE AGGIORNAMENTI E STRUTTURA DATABASE (JPA / HIBERNATE)
# =========================================================================
# 'validate' controlla che le classi Java corrispondano perfettamente alle tabelle su Postgres.
# Non crea, non modifica e NON cancella nulla sul tuo hard disk. Massima sicurezza!
spring.jpa.hibernate.ddl-auto=validate

# Dice a Hibernate che stiamo parlando specificamente con il dialetto di PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Specifica lo schema di default (le tue tabelle sono dentro 'public')
spring.jpa.properties.hibernate.default_schema=public

# =========================================================================
# 📺 MONITORAGGIO E DEBUG SQL (Vedi le azioni in tempo reale)
# =========================================================================
# Mostra nella console di Cursor tutti i comandi SQL generati da Spring Boot
spring.jpa.show-sql=true

# Rende l'SQL stampato nella console bello ordinato e facile da leggere (invece che tutto su una riga)
spring.jpa.properties.hibernate.format_sql=true

# Mostra i valori reali dei parametri all'interno delle query di debug
logging.level.org.hibernate.orm.jdbc.bind=trace

# Credenziali dell'applicazione registrata su Facebook Developer
facebook.app.id=IL_TUO_APP_ID_DI_FACEBOOK
facebook.app.secret=IL_TUO_APP_SECRET_DI_FACEBOOK

# =========================================================================
# 🚀 CONFIGURAZIONE SERVER DI SVILUPPO
# =========================================================================
# La porta su cui risponderà il tuo software Spring Boot quando lo avvierai
server.port=8080
